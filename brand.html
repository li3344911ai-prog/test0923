<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品牌理念 | 毛球日和</title>
    <link rel="stylesheet" href="./css/bootstrap.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #5a5a5a;
            line-height: 1.6;
        }

        html {
            background: #ffffff !important;
        }

        .pdf-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }

        .pdf-container embed,
        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>

<script src="./js/bootstrap.min.js"></script>

<script>
    function adjustNavbarPadding() {
        const navbar = document.querySelector('.navbar');
        const navbarHeight = navbar.offsetHeight;
        document.body.style.paddingTop = navbarHeight + 'px';
    }
    document.addEventListener('DOMContentLoaded', adjustNavbarPadding);
    window.addEventListener('resize', adjustNavbarPadding);
</script>

<body>

    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./index.html">首頁</a>
                    </li>
                    <li class="nav-item">

                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="./news.html">最新消息</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="./products.html">系列商品</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="./membership.html">加入會員</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="./faq.html">FAQ</a>
                    </li>
                    
                </ul>
            </div>
        </div>
    </nav>

    <!-- 品牌理念 PDF 容器 -->
    <div class="pdf-container">
        <embed src="./img/品牌理念.pdf#toolbar=0" type="application/pdf" />
    </div>

    <script src="./js/bootstrap.js"></script>
</body>

</html>
