<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系列商品 | 毛球日和</title>
    <link rel="stylesheet" href="./css/bootstrap.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #5a5a5a;
            line-height: 1.6;
        }

        nav {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            position: relative;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #9aa08a;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #c9b89a;
        }

        .nav-title {
            font-weight: 600;
            color: #9aa08a;
            margin-right: 30px;
            display: inline-block;
        }

        .product-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .product-section {
            margin-bottom: 0;
        }

        @media (max-width: 768px) {
            nav {
                padding: 15px 20px;
            }

            nav ul {
                gap: 20px;
            }

            .nav-title {
                display: block;
                margin-right: 0;
                margin-bottom: 15px;
            }
        }
    </style>
</head>

<script src="./js/bootstrap.min.js"></script>

<script>
    function adjustNavbarPadding() {
        const navbar = document.querySelector('.navbar');
        const navbarHeight = navbar.offsetHeight;
        document.body.style.paddingTop = navbarHeight + 'px';
    }
    document.addEventListener('DOMContentLoaded', adjustNavbarPadding);
    window.addEventListener('resize', adjustNavbarPadding);
</script>

<body>

    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./index.html">首頁</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./brand.html">品牌理念</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="./news.html">最新消息</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="./products.html">系列商品</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="./membership.html">加入會員</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="./faq.html">FAQ</a>
                    </li>
                    
                </ul>
            </div>
        </div>
    </nav>

    <section class="product-section">
        <img src="./img/品１gif.gif" alt="品牌1" class="product-image">
    </section>

    <section class="product-section">
        <img src="./img/品２gif.gif" alt="品牌2" class="product-image">
    </section>

    <section class="product-section">
        <img src="./img/品３.gif" alt="品牌3" class="product-image">
    </section>

    <script src="./js/bootstrap.js"></script>
</body>

</html>
